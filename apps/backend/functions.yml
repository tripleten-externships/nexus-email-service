index:
  name: TRIPLETEN-${sls:stage}-index
  handler: serverless.handler
  events:
    - http:
        method: get
        path: /
        documentation: ${file(docs/endpoints/index.doc.yml)}
        cors:
          origin: '*'
          headers:
            - Content-Type
            - Authorization
            - X-ApiVersion
            - X-AppVersion
            - X-BundleVersion
            - X-Platform
            - X-OSVersion
            - DeviceId
            - X-DeviceId
            - X-DeviceName
main:
  name: TASK-${sls:stage}-main
  handler: serverless.mainHandler
  events:
    - schedule:
        name: TASK-${sls:stage}-main-every-${self:custom.runEvery}m
        rate: ${self:custom.scheduling.${sls:stage}}
receiveSendGridHookEvents:
  name: TRIPLETEN-${sls:stage}-sendGridHookReceiver
  handler: serverless.handler
  environment:
    SENDGRID_QUEUE_URL: ${ssm:${sls:stage}-send_grid_sqs_url, self:custom.serverless-offline-ssm.ssm.${sls:stage}-send_grid_sqs_url}}
    SENDGRID_QUEUE_ARN: ${ssm:${sls:stage}-send_grid_sqs_arn, self:custom.serverless-offline-ssm.ssm.${sls:stage}-send_grid_sqs_arn}
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource: '*'
  events:
    - http:
        method: post
        path: webhook/sendgrid
        documentation: ${file(docs/endpoints/sendGridWebhook.doc.yml)}
processSendGridEventsTask:
  name: TRIPLETEN-${sls:stage}-sendGridProcessorTask
  handler: serverless.processSendGridEventsTask
  timeout: 120
  environment:
    SENDGRID_QUEUE_ARN: ${ssm:${sls:stage}-send_grid_sqs_arn, self:custom.serverless-offline-ssm.ssm.${sls:stage}-send_grid_sqs_arn}
  iamRoleStatementsInherit: true
  iamRoleStatements:
    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:SendMessage
      Resource: ${self:provider.environment.SENDGRID_QUEUE_ARN}
  events:
    - sqs:
        arn: ${self:provider.environment.SENDGRID_QUEUE_ARN}
        functionResponseType: ReportBatchItemFailures
        batchSize: 10
